<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接跳转确认</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      max-width: 620px;
      width: 100%;
      padding: 32px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title::before { content: "🔗"; font-size: 22px; }
    .section { margin-bottom: 20px; }
    .section-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .url-box {
      background: #f7f8fa;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      font-family: Consolas, monospace;
      line-height: 1.6;
      max-height: 100px;
      overflow-y: auto;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .info-table th,
    .info-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .info-table th {
      width: 100px;
      color: #666;
      font-weight: 500;
      background: #fafbfc;
    }
    .info-table td {
      color: #222;
      word-break: break-all;
      font-family: Consolas, monospace;
    }
    .btns {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    button {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-jump { background: #0052d9; color: #fff; }
    .btn-jump:hover { background: #0042b0; }
    .btn-cancel { background: #e5e6eb; color: #333; }
    .btn-cancel:hover { background: #d3d5da; }
    .tip {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">外部链接跳转确认</div>

    <div class="section">
      <div class="section-label">目标完整链接</div>
      <div class="url-box" id="fullUrl">-</div>
    </div>

    <div class="section">
      <div class="section-label">链接详情</div>
      <table class="info-table">
        <tbody>
          <tr>
            <th>目标域名</th>
            <td id="domain">-</td>
          </tr>
          <tr>
            <th>目标路径</th>
            <td id="path">-</td>
          </tr>
          <tr>
            <th>参数数量</th>
            <td id="paramCount">-</td>
          </tr>
          <tr>
            <th>跳转来源</th>
            <td id="jumpSource">-</td>
          </tr>
          <tr>
            <th>网关域名</th>
            <td id="gatewayDomain">-</td>
          </tr>
          <tr>
            <th>收件邮箱</th>
            <td id="recipient">-</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="btns">
      <button class="btn-cancel" id="cancel">取消返回</button>
      <button class="btn-jump" id="jump">立即跳转</button>
    </div>
    <div class="tip">按 Enter 键可快速跳转</div>
  </div>

  <script src="redirect.js"></script>
</body>
</html>
